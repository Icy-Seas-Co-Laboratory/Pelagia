[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pelagia"
version = "0.0.1"
description = "Integrated image processing, storage, API, CLI, and worker tools."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "opencv-python>=4.10,<5",
    "psutil>=5.9,<8",
    "thumbhash>=0.1.2",
    "zstandard",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
cli = ["typer>=0.12,<1"]
postgres = ["psycopg[binary]>=3.2,<4"]
kvstore-blake3 = ["blake3"]
worker-cpu = [
    "imagecodecs==2026.6.26",
    "numpy>=2.1,<2.5",
]
test = ["pytest"]

[project.scripts]
pelagia = "Pelagia.cli.app:main"

[tool.setuptools.packages.find]
include = ["Pelagia*"]

[tool.setuptools.package-data]
"Pelagia" = [
    "default.config.toml",
    "assets/**/*",
]
"Pelagia.storage" = ["sql/*.sql"]

[tool.setuptools.exclude-package-data]
"Pelagia" = [
    "assets/**/.DS_Store",
]

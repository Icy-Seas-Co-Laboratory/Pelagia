<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Pelagia ROI-first workflow</title>
  <desc id="desc">Schematic workflow from an immutable source frame through candidate ROI detection, refined mask output, and human-curated evidence.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f8fcfd"/><stop offset="1" stop-color="#eaf4f6"/></linearGradient>
    <linearGradient id="frame" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#d9eef0"/><stop offset="1" stop-color="#8ecbd1"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#092f45" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167c93"/></marker>
    <style>
      .ink{fill:#092f45}.muted{fill:#477083}.teal{fill:#167c93}.panel{fill:url(#panel);stroke:#c4dce1;stroke-width:2}.label{font:700 18px system-ui,sans-serif;letter-spacing:.02em}.small{font:500 14px system-ui,sans-serif}.tiny{font:600 12px system-ui,sans-serif;letter-spacing:.04em}.line{stroke:#167c93;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1200" height="400" rx="22" fill="#fff"/>
  <text x="40" y="38" class="tiny muted">PELAGIA · ROI-FIRST PROCESSING</text>
  <text x="40" y="70" class="label ink">From source frame to reviewable evidence</text>
  <text x="40" y="94" class="small muted">Derived artifacts retain their relationship to the immutable input throughout the workflow.</text>

  <g transform="translate(35 120)" filter="url(#shadow)">
    <rect width="250" height="220" rx="16" class="panel"/>
    <text x="22" y="34" class="label ink">1 · Source frame</text><text x="22" y="55" class="small muted">Immutable acquisition input</text>
    <rect x="22" y="72" width="206" height="112" rx="8" fill="url(#frame)" stroke="#79b6bf"/>
    <path d="M25 163 C66 132 72 87 118 112 S184 137 225 91" fill="none" stroke="#4c9aa9" stroke-width="5" opacity=".55"/>
    <ellipse cx="77" cy="126" rx="33" ry="17" transform="rotate(-20 77 126)" fill="#173f5a" opacity=".85"/>
    <ellipse cx="153" cy="111" rx="28" ry="14" transform="rotate(25 153 111)" fill="#206a7b"/>
    <circle cx="78" cy="125" r="5" fill="#8ed5d8"/><circle cx="153" cy="111" r="4" fill="#b8eef0"/>
    <text x="22" y="207" class="tiny muted">SOURCE PAYLOAD · PROVENANCE</text>
  </g>
  <path d="M293 230 H328" class="line" marker-end="url(#arrow)"/>

  <g transform="translate(325 120)" filter="url(#shadow)">
    <rect width="250" height="220" rx="16" class="panel"/>
    <text x="22" y="34" class="label ink">2 · Candidate ROI</text><text x="22" y="55" class="small muted">Detection with frame context</text>
    <rect x="22" y="72" width="206" height="112" rx="8" fill="url(#frame)" stroke="#79b6bf"/>
    <path d="M25 163 C66 132 72 87 118 112 S184 137 225 91" fill="none" stroke="#4c9aa9" stroke-width="5" opacity=".55"/>
    <ellipse cx="77" cy="126" rx="33" ry="17" transform="rotate(-20 77 126)" fill="#173f5a" opacity=".85"/>
    <ellipse cx="153" cy="111" rx="28" ry="14" transform="rotate(25 153 111)" fill="#206a7b"/>
    <rect x="124" y="83" width="60" height="55" rx="4" fill="none" stroke="#f4a340" stroke-width="3" stroke-dasharray="7 5"/>
    <path d="M184 83 h14 v14" fill="none" stroke="#f4a340" stroke-width="3"/>
    <text x="22" y="207" class="tiny muted">CROP · MASK · MEASUREMENTS</text>
  </g>
  <path d="M583 230 H618" class="line" marker-end="url(#arrow)"/>

  <g transform="translate(615 120)" filter="url(#shadow)">
    <rect width="250" height="220" rx="16" class="panel"/>
    <text x="22" y="34" class="label ink">3 · Refined mask</text><text x="22" y="55" class="small muted">Versioned derived artifact</text>
    <rect x="22" y="72" width="206" height="112" rx="8" fill="#092f45"/>
    <ellipse cx="127" cy="128" rx="70" ry="38" transform="rotate(25 127 128)" fill="#75cdd0"/>
    <ellipse cx="127" cy="128" rx="70" ry="38" transform="rotate(25 127 128)" fill="none" stroke="#d8ffff" stroke-width="3"/>
    <text x="22" y="207" class="tiny muted">PARAMETERS · VERSION</text>
  </g>
  <path d="M873 230 H908" class="line" marker-end="url(#arrow)"/>

  <g transform="translate(905 120)" filter="url(#shadow)">
    <rect width="260" height="220" rx="16" class="panel"/>
    <text x="22" y="34" class="label ink">4 · Curated evidence</text><text x="22" y="55" class="small muted">Human decision with model context</text>
    <rect x="22" y="76" width="82" height="82" rx="8" fill="#092f45"/>
    <ellipse cx="63" cy="117" rx="29" ry="15" transform="rotate(25 63 117)" fill="#75cdd0"/>
    <rect x="116" y="76" width="119" height="38" rx="8" fill="#d1edf0"/><circle cx="132" cy="95" r="7" fill="#167c93"/><text x="145" y="91" class="tiny ink">MODEL</text><text x="145" y="105" class="tiny ink">PREDICTION</text>
    <rect x="116" y="122" width="119" height="38" rx="8" fill="#167c93"/><path d="M130 141 l7 7 14-16" fill="none" stroke="#fff" stroke-width="3"/><text x="154" y="137" class="tiny" fill="#fff">HUMAN</text><text x="154" y="151" class="tiny" fill="#fff">REVIEW</text>
    <text x="22" y="190" class="tiny muted">LABEL · REVIEW · PROVENANCE</text>
  </g>
  <text x="600" y="378" text-anchor="middle" class="tiny muted">SCHEMATIC · ILLUSTRATIVE SHAPES, NOT EXPERIMENTAL DATA</text>
</svg>

# =============================================================================
# VALIDATION RULES
# =============================================================================

[validation]

# IDs are immutable once released.
stable_ids = true

# IDs must be unique across the entire vocabulary, not merely within a branch.
global_unique_ids = true

# Every parent_id must resolve to a node in the same vocabulary namespace.
require_valid_parents = true

# Circular hierarchies are invalid.
forbid_cycles = true

# A node may be selectable even if it has children.
allow_selectable_parent_nodes = true

# External identifiers need not exist for Pelagia-defined concepts.
require_external_mapping = false

# An exact external mapping must contain both authority and identifier.
require_identifier_for_exact_mapping = true


# =============================================================================
# MAPPING RELATIONSHIPS
# =============================================================================
#
# Supported mapping relationships:
#
# exact
#     Pelagia concept and external concept are intended to mean the same thing.
#
# close
#     Concepts substantially overlap but are not semantically identical.
#
# broader
#     Pelagia concept is broader than the mapped concept.
#
# narrower
#     Pelagia concept is narrower than the mapped concept.
#
# related
#     Useful relationship but not hierarchical/equivalent.
#
# =============================================================================


[mapping_relationships]

exact = "Equivalent concept."
close = "Substantially equivalent but not strictly identical."
broader = "Pelagia concept is broader than the external concept."
narrower = "Pelagia concept is narrower than the external concept."
related = "Associated concept without equivalence or hierarchy."

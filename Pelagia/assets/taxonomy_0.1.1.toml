# =============================================================================
# Pelagia Core Vocabulary
# =============================================================================
#
# Three independent controlled vocabularies:
#
#   taxonomy
#       What is the target?
#
#   target_tags
#       What properties does the target itself have?
#       Examples: life stage, sex, posture, condition.
#
#   image_tags
#       What properties does the image / ROI observation have?
#       Examples: blur, clipping, overexposure, segmentation failure.
#
# Design principles:
#
# - `id` is the stable Pelagia identifier.
# - Display names may change without changing `id`.
# - External authorities are represented by repeatable `mappings`.
# - Taxonomy is primarily single-valued.
# - Target tags and image tags are multi-valued.
# - Organizational nodes may be non-selectable.
# - Some child groups may be mutually exclusive.
#
# =============================================================================


[vocabulary]
id = "pelagia-core"
name = "Pelagia Core Vocabulary"
version = "0.1.1"
schema_version = "1.0.0"

description = """
Core controlled vocabulary for Pelagia image datasets and curation tools.
Defines taxonomy, target-level tags, and image/ROI-level tags.
"""

created = "2026-08-07"
language = "en"
status = "draft"


# =============================================================================
# SOURCE REGISTRY
# =============================================================================
#
# URLs are intentionally not repeated on individual concepts.
# Applications can associate these source IDs with their canonical resources.
#
# `retrieved` records when this vocabulary release was checked against
# the external authority.
# =============================================================================


[[sources]]
id = "worms"
name = "World Register of Marine Species"
organization = "Flanders Marine Institute / WoRMS"
authority_type = "taxonomy"
identifier_scheme = "aphia_id"
uri_scheme = "urn:lsid:marinespecies.org:taxname:{identifier}"
retrieved = "2026-08-07"

[[sources]]
id = "ptwg"
name = "PTWG namespace for non-conforming ROIs"
organization = "NASA SeaBASS / OCB Phytoplankton Taxonomy Working Group"
authority_type = "imaging_vocabulary"
version = "1"
identifier_scheme = "ptwg_term"
retrieved = "2026-08-07"

[[sources]]
id = "wod_lifestage"
name = "World Ocean Database Taxon Lifestage Code Table"
organization = "NOAA National Centers for Environmental Information"
authority_type = "life_stage_vocabulary"
identifier_scheme = "wod_code"
retrieved = "2026-08-07"

[[sources]]
id = "pelagia"
name = "Pelagia Core Vocabulary"
organization = "Icy Seas Co-Laboratory"
authority_type = "local_controlled_vocabulary"
identifier_scheme = "pelagia_concept_id"
version = "0.1.0"



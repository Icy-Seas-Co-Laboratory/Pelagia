# Example worker stack for scripts/pelagia_stack_from_toml.sh.
# Run with:
#   ./scripts/pelagia_stack_from_toml.sh start scripts/pelagia_workers.example.toml

[stack]
name = "dev-workers"
# Options: auto, always, never.
init_on_start = "auto"

[database]
dsn = "postgresql://postgres:postgres@127.0.0.1:5432/pelagia"
schema = "pelagia"

[cold_storage]
# Frames and other durable source payloads. This may point to the same service
# as [hot_storage] during local development.
endpoint = "http://127.0.0.1:7788"
token = ""
timeout_seconds = 30

[hot_storage]
# Candidate/refined ROI images and masks.
endpoint = "http://127.0.0.1:7788"
token = ""
timeout_seconds = 30

[skerry]
# The stack starts this local instance before Pelagia. Set managed = true when
# endpoints are operated outside this script.
managed = false
binary = "skerry"
root = "./data/skerry-cold"

[file_browser]
# Server-side roots exposed by GET /live/files.
# Relative paths are resolved from the Pelagia repository root.
root_path_import_dir = "./data/import"
allowed_root_paths = []

[processing.video_ingest]
n_tile = 4
# Ask OpenCV/FFmpeg to avoid hardware decode paths for formats like AV1.
prefer_software_decode = true
# Keep each worker single-threaded; increase after benchmarking worker concurrency.
opencv_threads = 1
decoder_threads = 1

[api]
enabled = true
host = "127.0.0.1"
port = 8000
# Allows PelagiaView from localhost and common private LAN IP origins.
cors_allow_origin_regex = "https?://(localhost|127\\.0\\.0\\.1|\\[::1\\]|10(?:\\.\\d{1,3}){3}|100\\.(?:6[4-9]|[7-9]\\d|1[01]\\d|12[0-7])(?:\\.\\d{1,3}){2}|192\\.168(?:\\.\\d{1,3}){2}|172\\.(?:1[6-9]|2\\d|3[01])(?:\\.\\d{1,3}){2})(?::\\d+)?"

[worker_defaults]
idle_sleep_seconds = 2.0
requeue_interval_seconds = 30.0

[worker_profiles]
# Pelagia workers use the CPU environment. Oracle Builder owns ML/GPU isolation.
default = "cpu"
roi_refinement = "cpu"

[[worker]]
name = "ingest-1"
capabilities = ["ingest"]

[[worker]]
name = "telemetry-1"
capabilities = ["telemetry_import"]

[[worker]]
name = "preprocess-1"
capabilities = ["preprocess"]

[[worker]]
name = "background-1"
capabilities = ["background"]

[[worker]]
name = "segment-1"
capabilities = ["segment"]

[[worker]]
name = "refine-1"
capabilities = ["roi_refinement"]

[[worker]]
name = "analysis-1"
capabilities = ["feature_space_analysis"]

[[worker]]
name = "registry-1"
capabilities = ["registry_load", "registry_export", "registry_generate", "export_bundle"]

[[worker]]
name = "storage-1"
capabilities = ["storage_reencode"]

[[worker]]
name = "allrounder"
capabilities = ["ingest", "background", "preprocess", "segment", "roi_refinement", "classify", "registry_load", "registry_export", "registry_generate", "export_bundle", "storage_reencode"]
enabled = false
